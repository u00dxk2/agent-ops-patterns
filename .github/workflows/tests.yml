name: tests

on:
  push:
    branches: [main]
  pull_request:

# Pinned least privilege. The jobs read the tree and run tests; nothing here
# needs write access, and a fork PR runs fork-controlled code, so the token it
# gets should be able to do as little as possible.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (version in the comment), so a moved
# upstream tag cannot change what runs here; test/workflow-pins.test.mjs enforces it.
# Dependabot (.github/dependabot.yml) checks weekly and proposes bumps by PR. By hand:
# resolve the new tag to its commit and replace both the SHA and the comment.

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # These versions are the README's version claim. Widening the claim
        # means widening this matrix first.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step, node:test only.
      - run: npm test

  # Every URL the CS329A skill cites must resolve. Its own job, so an arXiv or
  # YouTube outage reds ONE legible line here and never the unit suite above.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test test/skill-references.test.mjs
        env:
          CHECK_LINKS: "1"

  # Secret shapes in the commits this push or PR adds, commit by commit — so a
  # value added and deleted inside one PR still reds. Covers what push protection
  # does not: fork PRs, clones without the local hook, credentialed connection
  # strings. A range, not whole history: two ReDoS probe lines (a bare PEM header,
  # e3be970 and 92c6569) sit in history unmarked, so a full sweep never reads clean.
  # A force-push to main reds here too — the old tip is gone; read it, don't re-run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/check-staged-secrets.mjs --history 1 --selftest
      - run: node scripts/check-staged-secrets.mjs --range "$RANGE"
        env:
          RANGE: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.10 is the documented floor — CI proves the floor, not just the latest.
          python-version: "3.10"
      - run: python lib/secret_redaction.py

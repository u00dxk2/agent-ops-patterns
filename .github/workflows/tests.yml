name: tests

on:
  push:
    branches: [main]
  pull_request:

# Pinned least privilege. The jobs read the tree and run tests; nothing here
# needs write access, and a fork PR runs fork-controlled code, so the token it
# gets should be able to do as little as possible.
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # These versions are the README's version claim. Widening the claim
        # means widening this matrix first.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step, node:test only.
      - run: npm test

  # Every URL the CS329A skill cites must resolve. Its own job, so an arXiv or
  # YouTube outage reds ONE legible line here and never the unit suite above.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/skill-references.test.mjs
        env:
          CHECK_LINKS: "1"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.10 is the documented floor — CI proves the floor, not just the latest.
          python-version: "3.10"
      - run: python lib/secret_redaction.py
